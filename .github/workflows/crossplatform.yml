# Theo for Windows, Linux and Mac (crossplatform/): build, test on real Linux and Windows machines, and package installers.
# Nothing here publishes a release: installers are uploaded as workflow artifacts only.
name: Theo cross-platform

on:
  push:
    paths: ["crossplatform/**", ".github/workflows/crossplatform.yml"]
  workflow_dispatch:

# Builds and tests only: the job token can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: crossplatform-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: crossplatform

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  engine:
    name: Engine and suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crossplatform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: cargo test --workspace
      - name: Build theod
        run: cargo build -p theod
      - name: Linux install script against a stand-in GitHub
        if: runner.os == 'Linux'
        run: python3 tests/install_test.py
      - name: Ported harness suite against theod
        shell: bash
        env:
          THEO_TEST_ROOT: ${{ runner.temp }}/theo-suite/work
          PYTHONUNBUFFERED: "1"
        run: python tests/suite.py
      - name: Processes left running (Windows, when something failed)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: Get-CimInstance Win32_Process | Where-Object { $_.Name -like 'python*' -or $_.Name -like 'theod*' } | Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-Table -AutoSize -Wrap | Out-String -Width 400
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-results-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/theo-suite/results
            ${{ runner.temp }}/theo-suite/work/theod.log

  desktop:
    name: Desktop app and installers (${{ matrix.os }})
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
            app: app/src-tauri/target/release/theo-desktop
          - os: windows-2022
            bundles: msi,nsis
            app: app/src-tauri/target/release/theo-desktop.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crossplatform/app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus-x11
      - name: Build the app and its installers
        working-directory: crossplatform/app
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}
      - name: Drive the real app with the suite (Linux, under a virtual display)
        if: runner.os == 'Linux'
        env:
          THEOD_BIN: ${{ github.workspace }}/crossplatform/${{ matrix.app }}
          THEO_TEST_ROOT: ${{ runner.temp }}/theo-app/work
          THEO_START_WAIT: "90"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" python tests/suite.py T12 T13 T16 T19 T20 T09 F02 F06 P_usage P_retry_same_model P_quiet_routine T24 S02 S03 S04
      - name: Drive the real app with the suite (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          THEOD_BIN: ${{ github.workspace }}/crossplatform/${{ matrix.app }}
          THEO_TEST_ROOT: ${{ runner.temp }}/theo-app/work
          THEO_START_WAIT: "90"
        run: python tests/suite.py T12 T13 T16 T19 T20 T09 F02 F06 P_usage P_retry_same_model P_quiet_routine T24 S02 S03 S04
      - name: Name the installers and checksum them
        shell: bash
        run: python tools/collect_installers.py app/src-tauri/target/release/bundle dist "ci-${GITHUB_RUN_NUMBER}"
      - name: Install, reinstall and remove with install.ps1 (the real NSIS installer, no admin)
        if: runner.os == 'Windows'
        shell: bash
        run: python tests/install_ps_test.py dist/Theo-ci-${GITHUB_RUN_NUMBER}-windows-x64-setup.exe
      - name: Install the .deb and start Theo from it
        if: runner.os == 'Linux'
        run: |
          deb=dist/Theo-ci-${GITHUB_RUN_NUMBER}-linux-amd64.deb
          pkg=$(dpkg-deb -f "$deb" Package)
          sudo apt-get install -y "./$deb"
          bin=$(dpkg -L "$pkg" | grep -E '^/usr/bin/' | head -1)
          echo "package $pkg installs $bin"
          THEOD_BIN="$bin" THEO_TEST_ROOT=${{ runner.temp }}/theo-deb/work THEO_START_WAIT=90 WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" python tests/suite.py T12 P_usage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theo-installers-${{ matrix.os }}
          path: crossplatform/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-run-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/theo-app/results
            ${{ runner.temp }}/theo-app/work/theod.log

  # Theo as a person gets it on a Windows PC: the installer the desktop job just built, opened from the Start menu, clicked
  # through with the real Claude Code (npm's and its own Windows installer). With the repository secret
  # CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`), also real replies, the web, a connector and the tool limits on a real
  # account. windows-2025 is the Windows 11 24H2 base.
  windows-pc:
    name: Windows PC, real app (${{ matrix.os }})
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: theo-installers-windows-2022
          path: crossplatform/dist
      - name: Playwright, to click through the window over WebView2's DevTools port (no browser download)
        run: python -m pip install playwright==1.52.0
      - name: Install, first run, Claude Code, bots, connectors, tray, sign-in start, uninstall, .msi
        shell: bash
        env:
          THEO_PC_OUT: ${{ runner.temp }}/theo-pc
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python tests/windows_pc.py fresh "$(ls dist/*-windows-x64-setup.exe | head -1)" "$(ls dist/*-windows-x64.msi | head -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-pc-${{ matrix.os }}
          path: ${{ runner.temp }}/theo-pc

  # The new installer over the last build from main, with a bot and a chat made in the older one.
  windows-upgrade:
    name: Windows PC, update over the last main build
    needs: desktop
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: theo-installers-windows-2022
          path: crossplatform/dist
      - name: The last Windows installer built on main
        id: older
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow crossplatform.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then echo "No successful main build to update from."; exit 0; fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name theo-installers-windows-2022 --dir older
          echo "exe=$(ls older/*-windows-x64-setup.exe | head -1)" >> "$GITHUB_OUTPUT"
      - run: python -m pip install playwright==1.52.0
      - name: Older build, then this one over it
        if: steps.older.outputs.exe != ''
        shell: bash
        env:
          THEO_PC_OUT: ${{ runner.temp }}/theo-upgrade
        run: python tests/windows_pc.py upgrade "${{ steps.older.outputs.exe }}" "$(ls dist/*-windows-x64-setup.exe | head -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-upgrade
          path: ${{ runner.temp }}/theo-upgrade
