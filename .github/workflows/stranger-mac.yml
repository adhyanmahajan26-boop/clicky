# theo-fix-plan package 11, Mac: builds Theo and runs Tools/tests/stranger_mac.py, which meets Theo as a brand new user
# (fresh test profiles, no coding agent, one API key played by a local stand-in server). Nothing is signed, installed or
# published, and no real account or key is used.
#
# Cost: a private repo bills every Mac minute as ten, and this builds the whole app, so it runs only when asked
# (Actions › Stranger test (Mac) › Run workflow) and on pull requests into main.
name: Stranger test (Mac)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "leanring-buddy/**"
      - "Packages/**"
      - "crossplatform/crates/theo-connectors/**"
      - "Tools/tests/stranger_mac.py"
      - ".github/workflows/stranger-mac.yml"

permissions:
  contents: read

concurrency:
  group: stranger-mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stranger:
    name: Stranger test (Mac)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - uses: dtolnay/rust-toolchain@stable
      # The connector hub's helper, for the echo-app step (the Debug app may be built without it).
      - name: Build the connector helper
        working-directory: crossplatform
        run: cargo build -p theo-connectors
      - name: Build Theo (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"
      - name: Stranger test
        run: |
          app=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Debug" -maxdepth 1 -name "*.app" | head -1)
          echo "App: $app"
          python3 Tools/tests/stranger_mac.py --app "$app" --helper "$PWD/crossplatform/target/debug/theo-connectors" --out "$RUNNER_TEMP/stranger-mac"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stranger-mac
          path: |
            ${{ runner.temp }}/stranger-mac
            ~/Library/Application Support/Theo-Test-stranger*/test-instance.log
