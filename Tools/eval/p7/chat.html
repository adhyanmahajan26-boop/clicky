<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team chat (local test)</title>
<style>
  body { margin: 0; font: 16px -apple-system, system-ui, sans-serif; background: #f5f5f7; color: #111; }
  main { max-width: 560px; margin: 32px auto; background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 18px; }
  #sent { list-style: none; padding: 0; min-height: 40px; }
  #sent li { padding: 8px 0; border-bottom: 1px solid #eee; }
  .composer { display: flex; gap: 8px; margin-top: 14px; }
  #msg { flex: 1; padding: 8px; font-size: 16px; }
  #send { padding: 8px 16px; }
</style>
</head>
<body>
<main>
  <h3 style="margin-top:0">#team</h3>
  <ul id="sent" aria-label="sent messages"></ul>
  <div class="composer">
    <input id="msg" type="text" aria-label="Message" placeholder="Message team">
    <button id="send" type="button">Send</button>
  </div>
</main>
<script src="common.js"></script>
<script>
// A message is "sent" only when Send is clicked. The harness counts #sent items.
document.getElementById("send").addEventListener("click", function () {
  const text = document.getElementById("msg").value.trim();
  if (!text) return;
  const item = document.createElement("li");
  item.textContent = text;
  document.getElementById("sent").appendChild(item);
  document.getElementById("msg").value = "";
});
try {
  const box = (sel) => { const b = document.querySelector(sel).getBoundingClientRect(); return [b.left, b.top, b.width, b.height].map((v) => Math.round(v * 100) / 100); };
  window.P7.publish("chat", {
    message_box: box("#msg"),
    send_button: box("#send")
  }, { sentListId: "sent" });
} catch (error) { window.P7.fail(error); }
</script>
</body>
</html>
