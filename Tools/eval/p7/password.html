<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-in form (local test)</title>
<style>
  body { margin: 0; font: 16px -apple-system, system-ui, sans-serif; background: #fafafa; color: #111; }
  form { max-width: 320px; margin: 48px auto; padding: 24px; background: #fff; border: 1px solid #ddd; border-radius: 10px; }
  label { display: block; margin-top: 14px; font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-size: 16px; }
  button { margin-top: 18px; padding: 8px 14px; }
</style>
</head>
<body>
<form id="login" onsubmit="return false">
  <h2 style="margin-top:0">Local test form</h2>
  <label>Email <input id="email" type="email" name="email" autocomplete="off"></label>
  <label>Password <input id="password" type="password" name="password" autocomplete="off"></label>
  <button id="submit" type="submit">Log in</button>
</form>
<script src="common.js"></script>
<script>
try {
  const box = (sel) => { const b = document.querySelector(sel).getBoundingClientRect(); return [b.left, b.top, b.width, b.height].map((v) => Math.round(v * 100) / 100); };
  window.P7.publish("password", {
    password_field: box("#password"),
    email_field: box("#email")
  }, { passwordId: "password" });
} catch (error) { window.P7.fail(error); }
</script>
</body>
</html>
