<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theo</title>
  <link rel="stylesheet" href="kit/theo-pixel.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand"><span id="brand-face"></span><span>Theo</span></div>
    <div id="counters"></div>
    <button class="row nav" data-pane="home"><svg class="ic" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button id="new-bot" class="row nav"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New bot</button>
    <nav id="bots"></nav>
    <div class="section-label">Groups</div>
    <nav id="groups"></nav>
    <div class="footer">
      <button class="row nav" data-pane="connectors"><svg class="ic" viewBox="0 0 24 24"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0zM12 16v5"/></svg>Connectors</button>
      <button class="row nav" data-pane="routines"><svg class="ic" viewBox="0 0 24 24"><path d="M19.5 12A7.5 7.5 0 1 1 17.3 6.7M13.9 6.8h3.6V3.2M12 8.6V12l2.3 1.5"/></svg>Routines</button>
      <button class="row nav" data-pane="usage"><svg class="ic" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Usage</button>
      <button class="row nav" data-pane="settings"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>Settings</button>
    </div>
  </aside>
  <main id="main">
    <header id="head"><span id="head-face"></span><div class="head-tx"><div class="head-name"><span id="head-name"></span><span id="head-pill"></span></div><div id="head-detail"></div></div></header>
    <section id="pane"></section>
    <form id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <button id="send" type="submit" aria-label="Send">&#8593;</button>
    </form>
  </main>
  <dialog id="bot-dialog">
    <form method="dialog" id="bot-form">
      <h2 id="bot-dialog-title">New bot</h2>
      <div id="maker"></div>
      <div id="bot-fields">
        <label>Name <input name="name" required maxlength="40"></label>
        <label>What it does <input name="description" maxlength="120"></label>
        <label>Instructions <textarea name="instructions" rows="3"></textarea></label>
        <label>Brain <select name="provider" id="bot-brain"></select></label>
        <label>Model <input name="model" id="bot-model" list="bot-models" maxlength="120" autocomplete="off" spellcheck="false"><datalist id="bot-models"></datalist></label>
      </div>
      <menu><button value="cancel" class="btn" formnovalidate>Cancel</button><button value="ok" class="btn pri" id="bot-dialog-ok">Create</button></menu>
    </form>
  </dialog>
  <div id="setup" hidden></div>
  <script src="kit/theo-pixel.js"></script>
  <script src="app.js"></script>
</body>
</html>
