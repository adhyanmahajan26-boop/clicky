<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Theo dictation</title>
  <link rel="stylesheet" href="pill.css">
</head>
<body>
  <!-- Dictation's pill (the Mac's DictationPill): a live waveform while the chord is held, "Transcribing", then "Typed". -->
  <div id="pill" class="pill" hidden>
    <span id="icon" class="icon"></span>
    <span id="wave" class="wave" aria-hidden="true"></span>
    <span id="label" class="label"></span>
  </div>
  <script src="pill.js"></script>
</body>
</html>
