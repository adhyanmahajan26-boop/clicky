[workspace]
resolver = "2"
members = ["crates/theo-core", "crates/theod"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
once_cell = "1"
